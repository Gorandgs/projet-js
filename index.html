<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/style.css" />
        <title> Mon Gestionnaire de Celebrity Crush</title>
    </head>
    <body>
        <main>
            <header>
                <h1>
                    Mon Gestionnaire de Celebrity Crush
                </h1>
                <p> Gérez vos Celebrity Crush préférées </p>
                <button type="button" id="bouton-reinitialiser" class="bouton-secondaire">
                    Réinitialiser le catalogue
                </button>
            </header>

            <section>
                    <h2> Ajouter une Celebrity Crush </h2>
                    <form id="formulaire-crush">
                        <label for="champ-nom">Nom :</label>
                        <input 
                            type="text" 
                            id="champ-nom" 
                            placeholder="Nom" required 
                            oninput="verifierSaisie(this)"
                        />
                        <label for="champ-prenom">Prénom :</label>
                        <input 
                            type="text" 
                            id="champ-prenom" 
                            placeholder="Prénom" required 
                            oninput="verifierSaisie(this)"
                        />
                        <label for="champ-age">Âge :</label>
                        <input 
                            type="number" 
                            id="champ-age" 
                            placeholder="Âge" required
                            min="1"
                            oninput="verifierSaisie(this)"
                        />
                        <label for="champ-nationalite">Nationalité :</label>
                        <input 
                            type="text" 
                            id="champ-nationalite" 
                            placeholder="Nationalité" required 
                            oninput="verifierSaisie(this)"
                        />
                        <label for="champ-note">Note :</label>
                        <input 
                            type="number" 
                            id="champ-note" 
                            placeholder="Note" required 
                            min="0"
                            max="10"
                            step="0.1"
                            oninput="verifierSaisie(this)"
                        />
                        <button 
                            type="submit">AJOUTER
                        </button>
                    </form>
            </section>

            <section>
                <div class="titre-catalogue">
                    <h2>
                        Aperçu de vos Celebrity Crush
                    </h2>
                    <span id="compteur-crush">0 crush</span>
                </div>
                <div class="statistiques-crush" aria-label="Statistiques du catalogue">
                    <article class="statistique-crush">
                        <span>Résultats</span>
                        <output id="stat-total">0</output>
                    </article>
                    <article class="statistique-crush">
                        <span>Note moyenne</span>
                        <output id="stat-note-moyenne">0,0/10</output>
                    </article>
                    <article class="statistique-crush">
                        <span>Âge moyen</span>
                        <output id="stat-age-moyen">0 ans</output>
                    </article>
                    <article class="statistique-crush">
                        <span>Note max. / min.</span>
                        <output id="stat-min-max">0,0 / 0,0</output>
                    </article>
                </div>
                <form class="filtres-crush" id="formulaire-filtres" role="search">
                    <label class="champ-recherche" for="recherche-crush">Rechercher</label>
                    <input
                        type="search"
                        id="recherche-crush"
                        placeholder="Nom, prénom ou nationalité..."
                    />
                    <label for="filtre-categorie">Catégorie</label>
                    <select id="filtre-categorie">
                        <option value="toutes">Toutes les catégories</option>
                        <option value="Coup de cœur">Coup de cœur</option>
                        <option value="Très apprécié(e)">Très apprécié(e)</option>
                        <option value="À découvrir">À découvrir</option>
                    </select>
                </form>
                <div id="liste-crush"></div>
            </section>
        </main>

        <script src="js/script.js"></script>
    </body>
</html>
